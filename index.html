<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>LifeOS · Planner</title
  ><link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/components.css" />
  <body>
    <aside aria-label="Workspace sidebar"></aside>
    <main>
      <header>
        <button class="global-search" type="button" data-act="search" aria-label="Search tasks">⌕ Search <kbd>Ctrl K</kbd></button
        ><div class="focus-pill"><button type="button" id="timer-toggle" aria-label="Start focus timer" title="Start or pause timer">▶</button><button type="button" id="timer">Focus · 25:00</button></div>
      </header>
      <section id="screen"></section>
    </main>
    <dialog id="modal"><form id="form"></form></dialog>
    <script src="/runtime.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
