map $http_authorization $gym_auth { default ""; "~^Bearer " $http_authorization; }
map $upstream_http_content_security_policy $gym_csp {
 default $upstream_http_content_security_policy;
 "~^(?<prefix>.*)frame-ancestors 'none'(?<suffix>.*)$" "${prefix}frame-ancestors 'self'${suffix}";
}
server {
 listen 80;
 client_max_body_size 48m;
 proxy_set_header Host $http_host;
 location = /gym {return 302 /gym/;}
 location /gym/ {proxy_hide_header X-Frame-Options; proxy_hide_header Content-Security-Policy; add_header X-Frame-Options SAMEORIGIN always; add_header Content-Security-Policy $gym_csp always;proxy_pass http://gymweb:8080; proxy_set_header Authorization $gym_auth; }
 # Native clients paired to the base hostname use bearer tokens at /api.
 location /api/ {proxy_pass http://api:3000; proxy_set_header Authorization $gym_auth; }
 location / {proxy_pass http://planner:4310;}
}


